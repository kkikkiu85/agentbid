<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 940" width="1280" height="940" font-family="Inter, system-ui, sans-serif">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#8b93f8"/></marker>
  <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#5eead4"/></marker>
  <style>
    .t{fill:#e7ebf1;font-size:13px;font-weight:600}
    .s{fill:#9aa5b4;font-size:11px}
    .m{fill:#cdd6e3;font-size:10.5px;font-family:ui-monospace,Menlo,monospace}
    .lbl{fill:#68727f;font-size:9.5px;letter-spacing:.1em;font-weight:600}
    .zone{fill:#11151b;stroke:#222a34}
    .box{fill:#161b23;stroke:#2a333f;rx:9}
    .num{fill:#8b93f8;font-size:10.5px;font-family:ui-monospace,monospace;font-weight:700}
  </style>
</defs>
<rect width="1280" height="940" fill="#0a0c10"/>

<text x="34" y="36" class="t" font-size="17">AgentBid — data flow</text>
<text x="34" y="56" class="s">Where every piece of data is processed, what crosses the trust boundary, and what is left outside afterwards.</text>

<!-- zones -->
<rect class="zone" x="24" y="76" width="560" height="710" rx="14"/>
<text x="42" y="100" class="lbl" fill="#5eead4">ZONE 1 — YOUR DEVICE · TRUST BOUNDARY</text>
<rect class="zone" x="664" y="76" width="340" height="710" rx="14"/>
<text x="682" y="100" class="lbl" fill="#f5b544">ZONE 2 — AGENTBID MARKETPLACE · STATELESS</text>
<rect class="zone" x="1020" y="76" width="236" height="710" rx="14"/>
<text x="1038" y="100" class="lbl" fill="#f5b544">ZONE 3 — ADVERTISERS</text>

<!-- trust boundary -->
<line x1="624" y1="76" x2="624" y2="786" stroke="#f4766c" stroke-width="1.5" stroke-dasharray="7 6"/>
<text x="624" y="68" class="lbl" fill="#f4766c" text-anchor="middle">EGRESS BOUNDARY</text>

<!-- Zone 1 steps -->
<rect class="box" x="44" y="116" width="520" height="58"/>
<text x="60" y="138" class="num">1</text><text x="80" y="138" class="t">Prompt + conversation + long-term memory</text>
<text x="80" y="156" class="s">Raw natural language. Never serialised by any outbound code path.</text>

<rect class="box" x="44" y="186" width="520" height="76"/>
<text x="60" y="208" class="num">2</text><text x="80" y="208" class="t">Intent extraction</text>
<text x="80" y="226" class="s">Local deterministic parser by default. Pluggable seam for confidential</text>
<text x="80" y="241" class="s">inference (Nesa EE / HSS-EE), which changes who may read the</text>
<text x="80" y="256" class="s">prompt — not what is disclosed afterwards.</text>

<rect class="box" x="44" y="272" width="520" height="100" stroke="#2b5f57" fill="#0e1a18"/>
<text x="60" y="294" class="num">3</text><text x="80" y="294" class="t">Structured intent object — stays local in full</text>
<text x="80" y="312" class="m">category · destination · month · travel_style · party_size</text>
<text x="80" y="330" class="m" fill="#5eead4">budget_krw (exact) · must_have · dealbreakers · rejected_offers</text>
<text x="80" y="348" class="m" fill="#5eead4">raw_prompt · conversation_history · latent preferences</text>
<text x="80" y="364" class="s">No cookie, device ID or account identifier is constructed at any point.</text>

<rect class="box" x="44" y="380" width="520" height="76" stroke="#3a3e73"/>
<text x="60" y="402" class="num">4</text><text x="80" y="402" class="t">Privacy Gateway — strict allow-list</text>
<text x="80" y="420" class="s">You grant fields one by one. An ungranted field is not coarsened or nulled —</text>
<text x="80" y="435" class="s">it is never constructed. Entropy of the grant is metered in bits before you send.</text>
<text x="80" y="450" class="s">Fresh random session id, 15-minute TTL, no reuse across requests.</text>

<!-- egress payload -->
<line x1="400" y1="458" x2="400" y2="466" stroke="#8b93f8" stroke-width="2" marker-end="url(#a)"/>
<rect x="232" y="470" width="334" height="126" rx="9" fill="#080b0f" stroke="#f4766c"/>
<text x="248" y="490" class="lbl" fill="#f4766c">THE ONLY BYTES THAT CROSS</text>
<text x="248" y="510" class="m">{ "session": {"id":"abs_…","ttl_ms":900000},</text>
<text x="248" y="526" class="m">  "intent": {</text>
<text x="248" y="542" class="m">    "category":"travel", "destination":"JP",</text>
<text x="248" y="558" class="m">    "month":"2026-12", "party_size":2,</text>
<text x="248" y="574" class="m">    "travel_style":"independent",</text>
<text x="248" y="590" class="m">    "budget_band":"1.0-1.5M" } }</text>
<text x="232" y="614" class="s">≈ 365 bytes · 6 fields · 19.4 of 33 bits · anonymity set ≈ 1 in 72</text>

<line x1="570" y1="530" x2="676" y2="530" stroke="#8b93f8" stroke-width="2" marker-end="url(#a)"/>

<!-- Zone 2 -->
<rect class="box" x="684" y="116" width="300" height="70"/>
<text x="700" y="138" class="num">5</text><text x="720" y="138" class="t">Validate &amp; mint session</text>
<text x="720" y="156" class="s">Any field outside the permitted set is</text>
<text x="720" y="171" class="s">rejected (422), not silently ignored.</text>

<rect class="box" x="684" y="198" width="300" height="70"/>
<text x="700" y="220" class="num">6</text><text x="720" y="220" class="t">Blind eligibility filter</text>
<text x="720" y="238" class="s">Advertiser targeting rules vs disclosed</text>
<text x="720" y="253" class="s">fields only. 99 of 108 offers drop out.</text>

<rect class="box" x="684" y="280" width="300" height="86" stroke="#5d4a22" fill="#1a1509"/>
<text x="700" y="302" class="num" fill="#f5b544">7</text><text x="720" y="302" class="t">Sponsored-slot auction</text>
<text x="720" y="320" class="s">ad rank = bid × blind fit. Generalised</text>
<text x="720" y="335" class="s">second price. 2 paid slots. Billed only</text>
<text x="720" y="350" class="s">on a human click, never on a candidate.</text>

<rect class="box" x="684" y="378" width="300" height="78"/>
<text x="700" y="400" class="num">8</text><text x="720" y="400" class="t">Response</text>
<text x="720" y="418" class="s">Paid slots + the unpaid product feed.</text>
<text x="720" y="433" class="s">Product data only. Nothing about the</text>
<text x="720" y="448" class="s">user is echoed, stored or logged.</text>

<rect x="684" y="476" width="300" height="86" rx="9" fill="#1c1210" stroke="#6b352f"/>
<text x="700" y="496" class="lbl" fill="#f4766c">LEFT BEHIND IN ZONE 2 AFTER TTL</text>
<text x="700" y="516" class="m" fill="#f4766c">nothing joinable</text>
<text x="700" y="534" class="s">No profile, no user row, no cookie, no</text>
<text x="700" y="549" class="s">cross-request key. Only aggregate billing counters.</text>

<line x1="676" y1="612" x2="576" y2="612" stroke="#5eead4" stroke-width="2"/>
<text x="626" y="604" class="s" text-anchor="middle" fill="#5eead4">offers only</text>
<line x1="576" y1="612" x2="576" y2="652" stroke="#5eead4" stroke-width="2"/>
<line x1="576" y1="652" x2="572" y2="652" stroke="#5eead4" stroke-width="2" marker-end="url(#am)"/>

<!-- Zone 3 -->
<rect class="box" x="1036" y="198" width="204" height="94"/>
<text x="1052" y="220" class="t">Campaigns</text>
<text x="1052" y="240" class="s">Machine-readable offers:</text>
<text x="1052" y="255" class="s">price, dates, features,</text>
<text x="1052" y="270" class="s">targeting rules, max CPC.</text>
<text x="1052" y="286" class="s">Submitted ahead of time.</text>
<line x1="1032" y1="300" x2="992" y2="318" stroke="#8b93f8" stroke-width="1.6" marker-end="url(#a)"/>

<rect class="box" x="1036" y="330" width="204" height="110" stroke="#6b352f"/>
<text x="1052" y="352" class="t">What advertisers learn</text>
<text x="1052" y="372" class="m" fill="#5eead4">6 coarse intent fields</text>
<text x="1052" y="390" class="m" fill="#5eead4">one expiring session id</text>
<text x="1052" y="408" class="m" fill="#f4766c">no identity, no history</text>
<text x="1052" y="426" class="m" fill="#f4766c">no exact budget</text>

<rect class="box" x="1036" y="460" width="204" height="102"/>
<text x="1052" y="482" class="t">What they get back</text>
<text x="1052" y="502" class="s">A click from a buyer whose</text>
<text x="1052" y="517" class="s">own agent already verified</text>
<text x="1052" y="532" class="s">the offer against private</text>
<text x="1052" y="547" class="s">constraints. No wasted slot.</text>

<!-- Zone 1 return path -->
<rect class="box" x="44" y="636" width="524" height="62" stroke="#2b5f57"/>
<text x="60" y="660" class="num" fill="#5eead4">9</text><text x="80" y="660" class="t">Independent re-ranking on device</text>
<text x="80" y="678" class="s">Exact budget, hard requirements and dealbreakers applied here,</text>
<text x="80" y="692" class="s">for the first time. Bids cannot reorder this list.</text>

<rect class="box" x="44" y="706" width="524" height="46" stroke="#6b352f"/>
<text x="60" y="727" class="num" fill="#f4766c">10</text><text x="84" y="727" class="t">Refusal filter</text>
<text x="84" y="744" class="s">A paid slot below your private floor is never rendered, never clicked, never billed.</text>

<text x="60" y="774" class="num">11</text><text x="84" y="774" class="t">Human chooses</text>
<text x="200" y="774" class="s">— paid and independent shown separately, side by side.</text>

<text x="34" y="818" class="lbl" fill="#5eead4">STAYS INSIDE ZONE 1, ALWAYS</text>
<text x="34" y="838" class="s">raw prompt · conversation and long-term memory · exact budget · hard requirements (unless granted) · dealbreakers · previously rejected offers · every ranking decision</text>
<text x="34" y="868" class="lbl" fill="#f4766c">HONEST LIMITS</text>
<text x="34" y="888" class="s">An expiring session is not anonymity: rare attribute combinations, network metadata and post-click navigation can still re-identify. The anonymity</text>
<text x="34" y="906" class="s">figure is an estimate under a uniform prior, not a k-anonymity proof. Advertiser-supplied offer data is untrusted input. Nothing here governs</text>
<text x="34" y="924" class="s">tracking after you leave for a merchant site.</text>
</svg>
